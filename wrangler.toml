name = "berespro-api"
main = "src/index.js"
compatibility_date = "2024-11-01"

# D1 database. The database_id below points to the D1 database you created in the
# Cloudflare dashboard (Storage & Databases > D1 > berespro-db).
# This id is not a secret; it is useless without access to your Cloudflare account.
[[d1_databases]]
binding = "DB"
database_name = "berespro-db"
database_id = "9595441c-9638-4b61-ad6a-0e15c0be23af"

[vars]
CLERK_ISSUER = "https://good-penguin-19.clerk.accounts.dev"
COMMISSION_BPS = "2000"        # 20% platform fee (2000 bps)
REQUIRE_KYC_TO_BID = "1"       # partners must pass KYC before bidding

# Secrets: set these in the Cloudflare dashboard (Workers > Settings > Variables):
#   JWT_SECRET     (Encrypt)  random 40+ char string for signing session JWTs
#   CLERK_ISSUER   already set above as a plain var
#   ADMIN_IDS      (plain)    your user id(s), comma-separated, for admin dashboard
#   PSP_SECRET / PSP_KEY / PSP_BASE   later, when you register a PSP
