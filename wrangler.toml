name = "berespro"   # must match the Cloudflare Workers project name
main = "src/index.js"
compatibility_date = "2024-11-01"

# D1 database. The database_id below points to the D1 database you created in the
# Cloudflare dashboard (Storage & Databases > D1 > berespro-db).
# This id is not a secret; it is useless without access to your Cloudflare account.
[[d1_databases]]
binding = "DB"
database_name = "berespro-db"
database_id = "9595441c-9638-4b61-ad6a-0e15c0be23af"

# KYC document storage (PRIVATE R2 bucket). Create it in the dashboard
# (R2 Object Storage > Create bucket, name: berespro-kyc), then uncomment.
# NEVER enable public access on this bucket — it holds IC photos and selfies.
# Until this is bound, /kyc/upload and /kyc/submit refuse with 503 rather than
# pretending a document was received.
# [[r2_buckets]]
# binding = "KYC_DOCS"
# bucket_name = "berespro-kyc"

# Rate-limit store (high-traffic). Create a KV namespace in the dashboard
# (Storage & Databases > KV > Create), then uncomment and paste its id.
# Until this is bound, rate limiting falls back to D1 automatically.
# [[kv_namespaces]]
# binding = "RL_KV"
# id = "PASTE_KV_NAMESPACE_ID_HERE"

# IMPORTANT — `wrangler deploy` treats [vars] below as the SOURCE OF TRUTH for
# every plaintext variable. Cloudflare's Git integration runs `npx wrangler
# deploy` on every push to main, and that REVERTS OR REMOVES any plaintext var
# you set by hand in the dashboard but did NOT also add here. This is exactly
# how CLERK_ISSUER silently reverted to the dev instance after a routine app
# upload. Only Secret/Encrypted vars (JWT_SECRET, SETUP_KEY, Xendit keys) are
# safe to manage purely from the dashboard — they are not touched by [vars].
# Rule: any plaintext value you want to SURVIVE a deploy must live here.
[vars]
CLERK_ISSUER = "https://clerk.berespro.my"   # PRODUCTION — do not revert to *.clerk.accounts.dev
COMMISSION_BPS = "2000"        # 20% platform fee (2000 bps)
REQUIRE_KYC_TO_BID = "1"       # partners must pass KYC before bidding

# --- Plaintext vars not set yet. EVERY one of these must be uncommented HERE
# --- when you set it, not just typed into the dashboard, or the next deploy
# --- silently wipes it (this is what happened to CLERK_ISSUER).
#
# ADMIN_IDS = "usr_xxx"
#   Your user id, from the app: Settings -> "My user ID". Comma-separated for
#   several admins. Without it the control panel returns 403 for everyone.
#
# PUBLIC_URL = "https://app.berespro.my"
#   Where the APP lives (not this worker). Only used to build the payment
#   success/failure return URLs handed to Xendit. Harmless while payments are
#   in simulation mode; set it before switching Xendit live, or customers get
#   sent to a broken address after paying.
#   NOTE: /pay/return is currently handled by NEITHER the worker nor the app —
#   the app polls for payment status instead of relying on the redirect. Wire
#   that route up (or drop the return URLs) when Xendit goes live.
#
# XENDIT_SPLIT_RULE_ID = "splitru_xxx"
#   xenPlatform split rule id. Plaintext, so it belongs here — NOT only in the
#   dashboard. (XENDIT_SECRET_KEY and XENDIT_CALLBACK_TOKEN are Secrets and are
#   safe to keep dashboard-only.)
#
# DEV_LOGIN — deliberately ABSENT. Adding it with "1" re-opens /auth/dev-login
#   and /dev/simulate-pay. Never set it on this production worker.

# Secrets: set these in the Cloudflare dashboard (Workers > Settings > Variables),
# type Secret/Encrypted — these DO persist across deploys, unlike plaintext vars:
#   JWT_SECRET     random 40+ char string for signing session JWTs
#   SETUP_KEY      random string, gates /setup and /health/config
#
# Xendit (set as Secret/Encrypt in Settings > Runtime > Variables and secrets):
#   XENDIT_SECRET_KEY      Xendit dashboard > Settings > Developers > API Keys
#   XENDIT_CALLBACK_TOKEN  Xendit dashboard > Settings > Developers > Webhooks
#   XENDIT_SPLIT_RULE_ID   (plain Text) xenPlatform split rule id, splitru_xxx
#
# With XENDIT_SECRET_KEY unset the adapter stays in simulation mode, so the app
# still runs end to end. Set it only when you are ready to move real money.
